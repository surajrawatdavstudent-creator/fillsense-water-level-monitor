<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">FillSense system overview</title>
<desc id="desc">The ultrasonic sensor sends distance readings to the Arduino, which updates the LCD and buzzer.</desc>
<rect width="1400" height="500" rx="28" fill="#f3f6fb"/>
<text x="70" y="82" fill="#14263d" font-family="Arial,sans-serif" font-size="34" font-weight="700">How FillSense works</text>
<text x="70" y="120" fill="#52657d" font-family="Arial,sans-serif" font-size="19">Measure the gap • check the level • show status • give a warning</text>
<g>
<rect x="70" y="190" width="330" height="205" rx="22" fill="#ffffff" stroke="#cbd7e5" stroke-width="2"/>
<circle cx="235" cy="248" r="37" fill="#e6f1ff"/>
<path d="M211 251 Q235 228 259 251 M218 265 Q235 249 252 265" stroke="#2475c8" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="235" y="320" fill="#14263d" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700">HC-SR04</text>
<text x="235" y="354" fill="#52657d" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Measures the water gap</text>
</g>
<path d="M410 292 H515" stroke="#4b84c4" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M500 278 L518 292 L500 306" stroke="#4b84c4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g>
<rect x="530" y="160" width="340" height="265" rx="22" fill="#14263d"/>
<rect x="650" y="198" width="100" height="70" rx="10" fill="#24496f" stroke="#87add3" stroke-width="2"/>
<text x="700" y="242" fill="#ffffff" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">UNO</text>
<text x="700" y="317" fill="#ffffff" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700">Arduino Uno</text>
<text x="700" y="355" fill="#c7d7ea" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Filters readings and selects</text>
<text x="700" y="382" fill="#c7d7ea" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">the current alert level</text>
</g>
<path d="M880 292 H985" stroke="#4b84c4" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M970 278 L988 292 L970 306" stroke="#4b84c4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g>
<rect x="1000" y="160" width="330" height="112" rx="18" fill="#ffffff" stroke="#cbd7e5" stroke-width="2"/>
<rect x="1028" y="188" width="66" height="48" rx="6" fill="#17392d"/>
<text x="1061" y="219" fill="#b4efb6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">LCD</text>
<text x="1120" y="207" fill="#14263d" font-family="Arial,sans-serif" font-size="22" font-weight="700">16×2 LCD</text>
<text x="1120" y="238" fill="#52657d" font-family="Arial,sans-serif" font-size="17">Shows gap and status</text>
</g>
<g>
<rect x="1000" y="305" width="330" height="120" rx="18" fill="#ffffff" stroke="#cbd7e5" stroke-width="2"/>
<circle cx="1061" cy="365" r="29" fill="#fff0db"/>
<path d="M1049 354 L1058 354 L1072 343 V387 L1058 376 H1049 Z" fill="#b66a14"/>
<path d="M1078 353 Q1091 365 1078 377" stroke="#b66a14" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="1120" y="356" fill="#14263d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Buzzer</text>
<text x="1120" y="387" fill="#52657d" font-family="Arial,sans-serif" font-size="17">Gives audible warnings</text>
</g>
<text x="70" y="460" fill="#52657d" font-family="Arial,sans-serif" font-size="16">The sensor stays above the water. The system gives a warning but does not stop the water supply.</text>
</svg>